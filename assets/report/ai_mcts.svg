<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Minh hoa Monte Carlo Tree Search</title>
  <desc id="desc">MCTS lap lai bon buoc chon nut bang UCT, mo rong, rollout va cap nhat ket qua.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63837A"/></marker>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#183B3A}.title{font-size:28px;font-weight:700}.label{font-size:16px;font-weight:600}.small{font-size:13px;fill:#607674}.node{fill:#fff;stroke:#9AB4AB;stroke-width:2}.focus{fill:#D8F0E5;stroke:#167C69;stroke-width:3}
    </style>
  </defs>
  <rect width="960" height="520" rx="18" fill="#F2F7F2"/>
  <text x="40" y="52" class="title">MONTE CARLO TREE SEARCH</text>
  <text x="40" y="78" class="small">Tim kiem bang nhieu lan mo rong va mo phong co gioi han</text>
  <text x="48" y="126" class="label">Cay trang thai va thong tin tham</text>
  <g fill="none" stroke="#829F95" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M475 163L260 241M485 163L480 241M495 163L700 241"/>
    <path d="M240 281L165 345M275 281L340 345M460 281L440 345M500 281L555 345M680 281L650 345M715 281L790 345"/>
  </g>
  <circle cx="485" cy="151" r="29" class="node"/><text x="478" y="157" class="label">R</text>
  <circle cx="260" cy="260" r="31" class="focus"/><text x="253" y="266" class="label">A</text>
  <circle cx="480" cy="260" r="31" class="node"/><text x="473" y="266" class="label">B</text>
  <circle cx="700" cy="260" r="31" class="node"/><text x="693" y="266" class="label">C</text>
  <g>
    <rect x="125" y="345" width="80" height="46" rx="10" fill="#E0F2E9" stroke="#A6D3C0"/><text x="137" y="365" class="small">n=18</text><text x="137" y="382" class="small">Q=0.67</text>
    <rect x="300" y="345" width="80" height="46" rx="10" class="node"/><text x="312" y="365" class="small">n=6</text><text x="312" y="382" class="small">Q=0.50</text>
    <rect x="400" y="345" width="80" height="46" rx="10" class="node"/><text x="412" y="365" class="small">n=9</text><text x="412" y="382" class="small">Q=0.56</text>
    <rect x="515" y="345" width="80" height="46" rx="10" class="node"/><text x="527" y="365" class="small">n=4</text><text x="527" y="382" class="small">Q=0.50</text>
    <rect x="610" y="345" width="80" height="46" rx="10" class="node"/><text x="622" y="365" class="small">n=3</text><text x="622" y="382" class="small">Q=0.33</text>
    <rect x="750" y="345" width="80" height="46" rx="10" class="node"/><text x="762" y="365" class="small">n=2</text><text x="762" y="382" class="small">Q=0.50</text>
  </g>
  <rect x="667" y="112" width="247" height="62" rx="11" fill="#fff" stroke="#D5E4DD"/>
  <text x="685" y="138" class="label">UCT</text><text x="685" y="158" class="small">Gia tri trung binh + kham pha</text>
  <g>
    <rect x="40" y="431" width="205" height="54" rx="11" fill="#fff" stroke="#D5E4DD"/><text x="58" y="454" class="label">1. Chon</text><text x="58" y="474" class="small">UCT dan huong</text>
    <rect x="265" y="431" width="205" height="54" rx="11" fill="#fff" stroke="#D5E4DD"/><text x="283" y="454" class="label">2. Mo rong</text><text x="283" y="474" class="small">Them mot nuoc ung vien</text>
    <rect x="490" y="431" width="205" height="54" rx="11" fill="#fff" stroke="#D5E4DD"/><text x="508" y="454" class="label">3. Rollout</text><text x="508" y="474" class="small">Mo phong co gioi han</text>
    <rect x="715" y="431" width="205" height="54" rx="11" fill="#E0F2E9" stroke="#A6D3C0"/><text x="733" y="454" class="label">4. Cap nhat</text><text x="733" y="474" class="small">Truyen thuong nguoc len cay</text>
  </g>
</svg>